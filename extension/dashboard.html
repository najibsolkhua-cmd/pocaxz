<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>solk / job</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="ui.css">
</head>
<body class="app">
  <main class="home" id="home">
    <!-- Источники -->
    <button class="tile t-src t-avito" data-open="avito" type="button">
      <span class="dot-line"><i class="dot"></i><b class="count"></b></span>
      <span class="logo-slot" data-logo="avito"></span>
      <span class="sub"></span>
    </button>
    <button class="tile t-src t-generic" data-open="generic" type="button">
      <span class="dot-line"><i class="dot"></i><b class="count"></b></span>
      <span class="logo-slot" data-logo="generic"></span>
      <span class="sub"></span>
    </button>
    <button class="tile t-src t-telegram" data-open="telegram" type="button">
      <span class="dot-line"><i class="dot"></i><b class="count"></b></span>
      <span class="logo-slot" data-logo="telegram"></span>
      <span class="sub"></span>
    </button>
    <button class="tile t-src t-hh" data-open="hh" type="button">
      <span class="dot-line"><i class="dot"></i><b class="count"></b></span>
      <span class="logo-slot" data-logo="hh"></span>
      <span class="sub"></span>
    </button>

    <!-- Профиль -->
    <div class="tile t-profile" data-open="profile" role="button" tabindex="0">
      <span class="dot-line"><i class="dot"></i><span class="tile-title">Профиль и резюме</span></span>
      <div class="tile-body" id="profileTile"></div>
      <span class="tile-more">Настроить →</span>
    </div>

    <!-- Центральная плитка -->
    <section class="tile t-main" id="mainTile">
      <div class="main-top">
        <div class="clock"><div class="time" id="clockTime">--:--</div><div class="date" id="clockDate"></div></div>
        <div class="brand"><span class="solk">solk</span><span class="slash-job">/ job</span></div>
      </div>
      <button class="who" id="who" type="button" data-open="profile">
        <span class="name" id="whoName"></span>
        <span class="position" id="whoPosition"></span>
      </button>
      <button class="find" id="findBtn" type="button">
        <span class="find-fill" id="findFill"></span>
        <span class="find-text" id="findText">/ Найти работу</span>
      </button>
    </section>

    <!-- Лучшее -->
    <div class="tile t-top" data-open="all" role="button" tabindex="0">
      <span class="dot-line"><i class="dot"></i><span class="tile-title">Лучшее для вас</span></span>
      <div class="tile-body" id="topTile"></div>
    </div>

    <!-- Воронка -->
    <div class="tile t-funnel" data-open="funnel" role="button" tabindex="0">
      <span class="dot-line"><i class="dot"></i><span class="tile-title">Воронка</span></span>
      <div class="tile-body" id="funnelTile"></div>
    </div>

    <!-- Поиск -->
    <div class="tile t-search" data-open="search" role="button" tabindex="0">
      <span class="dot-line"><i class="dot"></i><span class="tile-title">Поиск и настройки</span></span>
      <div class="tile-body" id="searchTile"></div>
    </div>

    <!-- Отклики -->
    <div class="tile t-applied" data-open="applied" role="button" tabindex="0">
      <span class="dot-line"><i class="dot"></i><span class="tile-title">Мои отклики</span></span>
      <div class="tile-body" id="appliedTile"></div>
    </div>
  </main>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <header class="drawer-head" id="drawerHead">
      <div class="drawer-title" id="drawerTitle"></div>
      <a class="drawer-close" href="#" title="Закрыть (Esc)">×</a>
    </header>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
