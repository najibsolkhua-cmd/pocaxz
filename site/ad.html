<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Реклама</title>
  <!-- Эта страница открывается во фрейме внутри solk / job во время поиска.
       Код РСЯ работает здесь, на сайте: в самом расширении сторонние скрипты запрещены (Manifest V3). -->
  <style>
    html, body { margin: 0; height: 100%; background: #fff; font: 500 14px/1.4 system-ui, sans-serif; color: #6d7179; }
    #slot { width: 100%; height: 100%; display: grid; place-items: center; }
  </style>
</head>
<body>
<div id="slot">Реклама</div>
<script src="config.js"></script>
<script>
  (function () {
    var id = (window.SOLK || {}).rsyaBlockId;
    if (!id) return; // блок ещё не выдан — показываем пустую плашку «Реклама»
    var slot = document.getElementById('slot');
    slot.textContent = '';
    slot.id = 'yandex_rtb_' + id;
    window.yaContextCb = window.yaContextCb || [];
    window.yaContextCb.push(function () {
      Ya.Context.AdvManager.render({ blockId: id, renderTo: 'yandex_rtb_' + id });
    });
    var s = document.createElement('script');
    s.src = 'https://yandex.ru/ads/system/context.js';
    s.async = true;
    document.head.appendChild(s);
  })();
</script>
</body>
</html>
